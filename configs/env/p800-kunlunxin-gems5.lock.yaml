# P800 FlagGems 5.0 复测环境锁定（2026-10-16 实测采集）
#
# 用途: FlagGems 5.0 复测容器的环境核对
#       python3 scripts/check_env.py --device p800-kunlunxin-gems5
#       （4.2 共享镜像基线仍在 p800-kunlunxin.lock.yaml）
name: p800-kunlunxin-gems5
schema: 1
description: Kunlunxin P800 FlagGems 5.0 复测容器实测版本
collected_at: "2026-10-16"
hardware_collected_at: "2026-10-16"
family: kunlunxin
scope:
  - ops/sdpa / sdpa_math / embedding 在 FlagGems 5.0 栈的兼容性复测
  - "vllm-plugin-FL 0.2.0 dispatch 行为（known-issues #20 / #23）"
  - "A1-aten 真实 vLLM C2（embedding/sdpa_math，2026-10-29，随机权重
    /models/random-qwen3-tiny，issue #39；证据见 tests/framework_level/README.md
    与 tests/framework_level/evidence/）"
  - 框架级冒烟（冒烟模型缺失，framework 矩阵未复测，见复测页 §5.5）
hardware:
  model: P800 OAM
  count: 8
  memory_per_device: 98304 MiB
  driver: "515.58"
  runtime: "XPU-RT 10.2"
  firmware: "ALL 1.0.2.43.1.86"
system:
  os: Linux
  kernel: 6.8.0-87-generic
python: "3.10.18"
packages:
  torch: "2.9.0+cu129"
  torch_xmlir: "1.0.0.1"
  xtorch_ops: "0.1.2935+50a5d6a4"
  triton: "3.0.0+f69a5406"
  flag_gems: "5.0.0"
  vllm: "0.20.2+empty"
  vllm_fl: "0.2.0+g38e7dbc"
  transformers: "4.57.6"
notes: |-
  dev 容器 flagos-p800-gems5-vllm0202-dev（非共享镜像正式发布通道）；
  尚未登记对应镜像 tag/digest 或构建配方，本锁用于核对已有容器的软件版本，
  不作为完整安装清单。中央入口须显式选择 `p800-kunlunxin-gems5`，
  独立算子使用各自的本地硬件别名，见
  [昆仑芯环境配置](installation.md#kunlunxin)。
  flag_gems / vllm-plugin-FL 为 pip 安装，与 4.2 共享镜像的本地路径安装
  （/env/FlagGems、/env/xvllm-plugin-FL）不同。框架冒烟模型
  /workspace/random-llm-models/llama-3.1-8b-like 在该容器缺失（A1-aten C2 已改用
  随机权重 /models/random-qwen3-tiny 跑通，与矩阵/黄金口径分开），
  `--require-model` 会失败，framework 矩阵未复测
  （见 docs/flaggems5-p800-retest.md）。硬件快照取自主机 xpu-smi；
  torch_xmlir 捆绑的 xpu-smi 报告另一组数值（Driver 5.0.21.47 /
  XPU-RT 5.13.0），以主机工具为准。
  `torch_xmlir` 对应发行包名 `xmlir`；`xtorch_ops` 对应发行包名
  `XTorch-Ops`；`vllm_fl` 对应发行包名 `vllm-plugin-fl`；
  `flag_gems` 对应发行包名 `flag-gems`。
evidence:
  - path: docs/flaggems5-p800-retest.md
    note: FlagGems 5.0 P800 复测总入口（黄金、A1、mini-consumer、dispatch 与性能证据）
