# 设备 Profile: Cambricon MLU（本地实测栈）
# 复制自 _template.yaml；vendor 与 flag_gems DeviceDetector().vendor_name 一致。
name: cambricon
vendor: cambricon

auto_detect:
  module: torch_mlu                # 可 import 即识别

device:
  torch_device: "mlu:0"
  visible_devices: "0"
  dispatch_key: PrivateUse1        # MLU 是 PyTorch PrivateUse1 后端

framework:
  tensor_parallel_size: 1
  distributed_executor_backend: mp
  max_model_len: 4096
  max_num_seqs: 50
  max_num_batched_tokens: 8192
  gpu_memory_utilization: 0.85
  enforce_eager: true
  enable_prefix_caching: false
  load_format: safetensors
  seed: 20260823
  model_path: /path/to/model      # 框架级冒烟模型（随机权重即可）
  quirks:
    keep_default_prefer: false
    require_two_visible_devices: false

vendor_delegate: null             # MLU 无厂商委托，走 reference
reference_fallback: reference.torch

# 厂商 kernel 直测清单（本算子不涉及，留空）
vendor_kernels: []
