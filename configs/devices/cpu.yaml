# 设备 Profile: CPU（跨硬件黄金锚点——最可信的确定性参照）
name: cpu
vendor: cpu

auto_detect: {}                 # CPU 不参与自动探测（显式 --device cpu 使用）

device:
  torch_device: "cpu"
  visible_devices: ""           # vllm 引擎不适用; transformers 引擎直接用 CPU
  dispatch_key: CPU

# CPU 上经 HuggingFace transformers 直接生成（最权威的语义参考实现，
# 完全绕过 vLLM/厂商栈）。golden_engine 字段由 build_golden 读取。
golden_engine: transformers

framework:
  tensor_parallel_size: 1
  distributed_executor_backend: mp
  max_model_len: 4096
  max_num_seqs: 50
  max_num_batched_tokens: 8192
  gpu_memory_utilization: 0.85
  enforce_eager: true
  enable_prefix_caching: false
  load_format: safetensors
  seed: 20260823
  model_path: /workspace/random-llm-models/llama-3.1-8b-like
  quirks:
    keep_default_prefer: false
    require_two_visible_devices: false

vendor_delegate: null

reference_fallback: reference.torch
