# 新芯片接入模板: 复制本文件为 <芯片名>.yaml 并填写
name: my-chip
vendor: myvendor                  # 与 flag_gems DeviceDetector().vendor_name 一致

auto_detect:
  module: my_vendor_lib           # 可 import 即识别（可选）

device:
  torch_device: "cuda:0"          # torch 侧设备串 (cuda/xpu/npu/...)
  visible_devices: "0"            # 框架级测试暴露的卡号
  dispatch_key: CUDA              # aten 注册 key (CUDA/PrivateUse1/...)

framework:
  tensor_parallel_size: 1
  distributed_executor_backend: mp
  max_model_len: 4096
  max_num_seqs: 50
  max_num_batched_tokens: 8192
  gpu_memory_utilization: 0.85
  enforce_eager: true
  enable_prefix_caching: false
  load_format: safetensors
  seed: 20260823
  model_path: /path/to/model      # 框架级冒烟模型（随机权重即可）
  quirks:
    keep_default_prefer: false
    require_two_visible_devices: false

vendor_delegate: null             # "my_lib.my_op" 或 null(委托 reference)

reference_fallback: reference.torch
