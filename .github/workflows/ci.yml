name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # wt 2026-10-07-fix 新增 packaging 门: 算子包化回归（CPU 可跑部分）
  # ——全算子 __init__.py 导入扫描; NPU 消费段在本机跑, CI 里跳过。
  # # wt <wangt635@ustc.edu.cn>
  ops-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装 CPU 依赖
        run: |
          pip install pyyaml -q
          pip install torch --index-url https://download.pytorch.org/whl/cpu -q
      - name: 算子包化导入扫描（16 目录）
        run: |
          python3 - <<'EOF'
          import importlib, pathlib, sys
          sys.path.insert(0, '.')
          root = pathlib.Path('ops')
          dirs = [d for d in sorted(root.iterdir())
                  if d.is_dir() and not d.name.startswith('__')]
          bad = []
          for d in dirs:
              try:
                  m = importlib.import_module(f'ops.{d.name}')
                  assert hasattr(m, 'register_a1'), '缺 register_a1 导出'
              except Exception as e:
                  bad.append(f'{d.name}: {type(e).__name__}: {e}')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print(f'ops-packaging: {len(dirs)}/{len(dirs)} 目录导入+导出 OK')
          EOF

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装 CPU 依赖
        run: |
          pip install pytest pyyaml -q
          pip install torch --index-url https://download.pytorch.org/whl/cpu -q
      - name: 单元测试（无 GPU）
        run: python -m pytest tests/unit -q

  docs-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Markdown 链接与锚点检查
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys
          root = pathlib.Path('.')
          errs = []
          anchor_cache = {}

          def anchors_of(p):
              k = str(p)
              if k not in anchor_cache:
                  text = p.read_text(encoding='utf-8', errors='replace')
                  hs = re.findall(r'^#{1,6}\s+(.*)$', text, re.M)
                  anchor_cache[k] = {
                      re.sub(r'[^\w\u4e00-\u9fff-]', '', h.strip().lower().replace(' ', '-'))
                      for h in hs}
              return anchor_cache[k]
