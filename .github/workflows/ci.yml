name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Markdown 链接与锚点检查
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys
          root = pathlib.Path('.')
          errs = []
          anchor_cache = {}

          def anchors_of(p):
              k = str(p)
              if k not in anchor_cache:
                  try:
                      anchor_cache[k] = set(re.findall(r'<a id="([^"]+)"', p.read_text()))
                  except Exception:
                      anchor_cache[k] = set()
              return anchor_cache[k]

          for md in root.rglob('*.md'):
              if '.git' in str(md):
                  continue
              raw = md.read_text()
              # mermaid 结构校验
              for m in re.finditer(r'```mermaid\n(.*?)```', raw, re.S):
                  b = m.group(1)
                  if 'xychart' in b:
                      assert 'bar [' in b and 'x-axis' in b, f'{md}: xychart 缺件'
                  elif 'flowchart' in b:
                      pass  # 网格/定位图可无边，只有流程图才要求边
              # 链接检查（跳过代码块）
              text = re.sub(r'```.*?```', '', raw, flags=re.S)
              for m in re.finditer(r'\[([^\]]*)\]\(([^)#\s]+)(?:#([^)\s]+))?\)', text):
                  target, anchor = m.group(2), m.group(3)
                  if target.startswith(('http', 'mailto')):
                      continue
                  tp = (md.parent / target).resolve()
                  if not tp.exists():
                      errs.append(f'{md}: -> {target}')
                  elif anchor and anchor not in anchors_of(tp):
                      errs.append(f'{md}: #{anchor} in {target}')

          print(f'检查完成: {len(errs)} 个错误')
          for e in errs:
              print(' -', e)
          sys.exit(1 if errs else 0)
          EOF

      - name: Python 语法检查
        run: |
          python3 - <<'EOF'
          import ast, pathlib, sys
          fails = []
          for p in pathlib.Path('.').rglob('*.py'):
              if '.git' in str(p):
                  continue
              try:
                  ast.parse(p.read_text(), filename=str(p))
              except SyntaxError as e:
                  fails.append(f'{p}: {e}')
          if fails:
              for f in fails:
                  print(' -', f)
              sys.exit(1)
          print('Python 语法检查通过')
          EOF

      - name: YAML 配置检查
        run: |
          pip install pyyaml -q
          python3 - <<'EOF'
          import yaml, glob, sys
          fails = []
          for f in glob.glob('configs/devices/*.yaml') + glob.glob('inputs/*.yaml'):
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  fails.append(f'{f}: {e}')
          if fails:
              for f in fails:
                  print(' -', f)
              sys.exit(1)
          print('YAML 检查通过')
          EOF

      - name: Intake manifest 契约校验
        run: python3 scripts/intake_validate.py --validate-only

      - name: 性能基线结构检查
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          fails = []
          for f in glob.glob('perf/baselines/*.json') + ['intake/manifest.schema.json']:
              try:
                  d = json.load(open(f))
              except Exception as e:
                  fails.append(f'{f}: {e}')
                  continue
              if f.startswith('perf/'):
                  for k in ('schema', 'device', 'created_at', 'updated_at',
                            'git_commit', 'env_fingerprint', 'cases'):
                      if k not in d:
                          fails.append(f'{f}: 缺字段 {k}')
                  for cid, c in d.get('cases', {}).items():
                      if 'latency_ms' not in c.get('metrics', {}):
                          fails.append(f'{f}: {cid} 缺 metrics.latency_ms')
          if fails:
              for x in fails:
                  print(' -', x)
              sys.exit(1)
          print('性能基线结构检查通过')
          EOF
