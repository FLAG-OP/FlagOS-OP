# ops/README.md 的唯一事实来源。
#
# Rules:
# - 只登记已交付证据；不要把未来移植写成已完成。
# - 规划中的厂商只放在 platform_families；测试和报告合入后再加入算子条目。
# - 修改本文件后运行 scripts/build_ops_index.py。
# - 每个 platforms.<family> 的 evidence 是**逐 profile 记录列表**（issue #41
#   + 复审意见 3）——「算子 + profile」是证据记录的最小单位：
#       evidence:
#         - profile: <该 family 已交付 profile>
#           level: C0 | C1 | C2 | C2-routing-boundary
#           basis: <C1/C2 必填：consumer 证据范围>
#           report: <C2 必填：仓库内证据报告，且必须列入 evidence_paths>
#           consumer: <可选：consumer/engine 标识，与结构化报告核对>
#           status: <可选：维护者审阅状态（complete-pending-review = 已采集待审阅）>
#   每个已交付 profile 必须有独立记录；operator 顶层 evidence/evidence_basis/
#   evidence_paths 是记录的派生汇总与证据清单，不能独立填写。
#   三个正交维度分开表述：level（证据等级）/ 报告 status·ok（实验判定）/
#   记录 status（维护者审阅状态）——complete-pending-review 表示证据已采集、
#   待审阅，不等于全量 PASS（区别于 platform_families 的 partial = 平台交付
#   部分完成）；README 按 profile 展示，同 family 下多个 profile 不共享
#   未区分的等级。

